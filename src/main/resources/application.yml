server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: region-sync-node

  # ── MySQL 数据库配置 ──
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:region_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate 配置 ──
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Kafka 配置 ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: region-${REGION_ID:NA}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

region:
  # 本节点的 Region ID（NA / EU / CN）
  id: ${REGION_ID:NA}

  # 数据归属映射: DataCategory -> Master Region ID
  # "REGIONAL" 表示每个 Region 各自为 Master（按数据的 ownerRegion 判断）
  category-owner-map:
    SYSTEM_CONFIG: NA
    ROLE_PERMISSION: NA
    JOB: REGIONAL
    TALENT: REGIONAL
    FINANCE: REGIONAL

  # 其他 Region 节点的 URL（regionId -> url）
  peer-urls: {}

  # 同步拉取间隔（毫秒）
  sync-interval-ms: ${SYNC_INTERVAL_MS:3000}

  # 健康检查间隔（毫秒）
  health-check-interval-ms: ${HEALTH_CHECK_INTERVAL_MS:5000}

# ── Debezium 消费者配置 ──
debezium:
  topic: ${DEBEZIUM_TOPIC:dbserver.region_db.company}
  consumer:
    enabled: ${DEBEZIUM_CONSUMER_ENABLED:false}

logging:
  level:
    com.example.regionsync: DEBUG
    org.apache.kafka: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{regionId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
